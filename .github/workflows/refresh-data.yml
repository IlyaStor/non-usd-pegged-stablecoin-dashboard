name: Refresh Dashboard Data

on:
  schedule:
    # Every 2 days. A 20h freshness window inside fetch-dune-data.js still
    # re-executes on this cadence, and skips a second execution if the job
    # is retried the same day.
    - cron: '0 0 */2 * *'
  workflow_dispatch:

# Queue a second trigger instead of cancelling a run that may already have
# spent Dune execution credits.
concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The script stops itself at DUNE_JOB_WAIT_MINUTES (default 36) so this
    # limit is only a backstop. Stopping inside the script lets the commit
    # step publish finished networks and the execution ledger.
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install fonts for the social image
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Install dependencies
        run: npm install

      # GitHub Actions secret name is DUNE_API_KEY. Do not rename it.
      # Optional repository variables: DUNE_PERFORMANCE (small|medium|large,
      # default medium), DUNE_FRESHNESS_HOURS (default 20), and
      # DUNE_JOB_WAIT_MINUTES (default 36).
      # REDIS_URL is no longer read.
      # continue-on-error lets a partial run commit finished networks and the
      # execution ledger before the job is marked failed.
      - name: Execute Dune queries and write data.json
        id: fetch
        continue-on-error: true
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_PERFORMANCE: ${{ vars.DUNE_PERFORMANCE }}
          DUNE_FRESHNESS_HOURS: ${{ vars.DUNE_FRESHNESS_HOURS }}
          DUNE_JOB_WAIT_MINUTES: ${{ vars.DUNE_JOB_WAIT_MINUTES }}
        run: node fetch-dune-data.js

      - name: Commit and push if changed
        if: always() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure')
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data.json og.png refresh-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail when a query is still running or was not started
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "The fetch step exited before every network finished. Finished networks may already have been committed by the previous step. The query error is in the Execute Dune queries log above this message."
          exit 1
